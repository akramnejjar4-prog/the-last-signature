<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Last Signature | Verity Gallery</title><style>
:root{color-scheme:dark;--bg:#091513;--panel:#142723;--panel2:#1c342e;--gold:#e5bd72;--ink:#f5eedf;--muted:#b5c5bd;--line:#476359;--bad:#ffb7a8;--good:#a7e4bd}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0%,#23443b 0%,#0b1916 55%,#07110f 100%);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);min-height:100vh}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:3px}.wrap{max-width:980px;margin:auto;padding:20px 16px 55px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:8px 0 16px}.brand{color:var(--gold);font-weight:800;letter-spacing:.18em;font-size:.82rem}.timer{font-variant-numeric:tabular-nums;font-size:1.45rem;font-weight:800;color:var(--gold)}h1,h2{font-family:Georgia,serif;line-height:1.12}h1{font-size:clamp(2.5rem,7vw,5.3rem);margin:12px 0}h2{font-size:clamp(1.7rem,5vw,2.7rem);margin:0 0 12px}.eyebrow{color:var(--gold);letter-spacing:.16em;text-transform:uppercase;font-size:.75rem;font-weight:800}.lead{font-size:1.1rem;line-height:1.65;color:var(--muted)}.card{background:linear-gradient(145deg,rgba(30,57,49,.98),rgba(13,30,26,.98));border:1px solid var(--line);border-radius:18px;padding:clamp(18px,4vw,32px);box-shadow:0 20px 70px #0005;margin-top:24px}.hero{min-height:270px;background:linear-gradient(90deg,#071511d9,#0715114d),radial-gradient(circle at 75% 50%,#977348 0,#39483c 35%,#152822 65%);border:1px solid #7c6b50;border-radius:16px;padding:28px;display:flex;flex-direction:column;justify-content:center}.btn{background:var(--gold);color:#1b251d;border:0;border-radius:9px;padding:13px 20px;font-weight:850;min-height:46px}.btn:hover{filter:brightness(1.1)}.secondary{background:transparent;color:var(--ink);border:1px solid var(--line)}.btn:disabled{opacity:.45;cursor:not-allowed}.field{background:#091915;color:white;border:1px solid #7b9b8c;padding:13px 14px;border-radius:9px;width:100%;max-width:380px}.stack{display:grid;gap:12px}.option{display:flex;gap:12px;align-items:flex-start;border:1px solid #5d796d;background:#122a24;border-radius:11px;padding:14px;cursor:pointer;line-height:1.5}.option:has(input:checked){border-color:var(--gold);background:#354334}.option input{margin-top:5px;accent-color:var(--gold);transform:scale(1.2)}.option strong{color:var(--gold)}.bar{display:flex;gap:6px;margin:20px 0}.bar span{height:7px;flex:1;border-radius:10px;background:#42584e}.bar .done{background:var(--gold)}.feedback{padding:13px;border-radius:8px;background:#422722;border:1px solid #aa6258;color:#ffe3dc;margin-top:14px}.feedback.ok{background:#183e2a;border-color:#4c9a68;color:#c5f3d4}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}.clue{color:var(--gold);font-weight:800;letter-spacing:.04em}.note{border-left:3px solid var(--gold);padding:12px 16px;background:#0c201a;margin:16px 0;color:var(--muted);line-height:1.6}.puzzletext{color:#d4e0d8;line-height:1.65}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.tile{border:1px solid var(--line);background:#122820;border-radius:12px;padding:15px;line-height:1.5}.tile b{color:var(--gold)}.lock{font-size:clamp(2.8rem,9vw,5rem);text-align:center;letter-spacing:.18em;font-weight:900;color:var(--gold);padding:14px;background:#091915;border:2px solid #9d8454;border-radius:12px;margin:18px auto;max-width:400px}.safe{width:210px;height:200px;border:9px solid #a98b55;background:linear-gradient(130deg,#334a3e,#0e201b);border-radius:20px;display:grid;place-items:center;margin:20px auto;box-shadow:inset 0 0 30px #0008,0 10px 40px #0008;transform-origin:left center}.wheel{border:8px double var(--gold);width:90px;height:90px;border-radius:50%;display:grid;place-items:center;font-size:2.4rem;color:var(--gold)}.opening .wheel{animation:spin 1.1s ease-in-out}.opening .safe{animation:door 1.3s ease-in-out .8s forwards}@keyframes spin{to{transform:rotate(720deg)}}@keyframes door{to{transform:perspective(700px) rotateY(-75deg);opacity:.3}}.status{text-align:center;color:var(--gold);font-size:1.4rem;font-weight:900;letter-spacing:.09em}.hidden{display:none!important}.small{font-size:.86rem;color:var(--muted)}.footer{text-align:center;color:#a9b9af;font-size:.75rem;margin-top:25px}.ending{text-align:center;padding:30px 5px}.ending .seal{font-size:5rem}.score{font-size:2.3rem;color:var(--gold);font-weight:800}.timeline{display:grid;gap:10px}.timeline div{padding:12px;border-left:3px solid var(--gold);background:#10251f}.sr{position:absolute;left:-9999px}@media(max-width:600px){.grid2{grid-template-columns:1fr}.top{align-items:flex-start}.timer{font-size:1.15rem}.wrap{padding:12px}.hero{min-height:220px;padding:18px}.card{margin-top:14px}.option{padding:12px}}
</style></head><body><div class="wrap"><header class="top"><div><div class="brand">VERITY GALLERY · CONFIDENTIAL</div><div class="small">THE LAST SIGNATURE — CONTRACT LAW ESCAPE ROOM</div></div><div id="clock" class="timer" aria-live="off">15:00</div></header><main id="app"></main><footer class="footer">Classroom game · No hints · All puzzles based on the supplied escape-room outline</footer></div><script>
'use strict';
const app=document.getElementById('app'),clock=document.getElementById('clock');let stage=-1,team='',remaining=900,timer=null,finished=false,locked=false,answers={},digits=[];const correct=[['B','E','F'],'6',['1','4','7','8'],['1','3','5']];
const offer=[['A','A price tag displayed in a shop window.'],['B','A newspaper ad: “Saturday at 9 a.m. sharp: 3 framed prints worth $300 each, for $10 each. First come, first served.”'],['C','“Would you consider selling your painting?”'],['D','An announcement that an auction will be held next week.'],['E','“I’ll sell you my car for $3,000. Let me know by Friday.”'],['F','“$200 reward to anyone who returns my lost dog.”']];
const consideration=[['1','A peppercorn is exchanged for a valuable item.'],['2','Someone repainted a room before anyone requested it, then was promised payment.'],['3','A police officer promises to testify when already required by subpoena.'],['4','A nephew gives up drinking and smoking in exchange for a promise.'],['5','Sailors demand extra pay for a voyage they are already contractually bound to complete.'],['6','An aunt promises a gift “because you’re my favorite.”'],['7','A party agrees not to sue over a genuine legal claim in exchange for payment.'],['8','One party promises money in exchange for a laptop.']];
const jobs=[['1','Convert a storage room into an exhibition room after receiving the required permit.'],['2','Build an extra exhibition room even though local zoning rules prohibit it.'],['3','Install security cameras throughout the gallery.'],['4','Remove an emergency exit to create more wall space for paintings.'],['5','Replace the gallery lighting with LED lighting.']];
const stories=[['D','A gallery owner signs only because someone threatens to harm them unless they agree.','Duress'],['E','A buyer reasonably relies on a clear promise and spends money preparing for the sale; the promisor later tries to withdraw it.','Estoppel (promissory)'],['A','Before the delivery date, the seller clearly announces they will not perform their contract.','Anticipatory repudiation'],['L','An offer states that it expires Friday. The buyer tries to accept on Monday.','Lapse of offer']];
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function startTimer(){clearInterval(timer);timer=setInterval(()=>{if(finished)return;remaining--;updateClock();if(remaining<=0){clearInterval(timer);stage=99;render()}},1000)}function updateClock(){clock.textContent=String(Math.floor(Math.max(0,remaining)/60)).padStart(2,'0')+':'+String(Math.max(0,remaining)%60).padStart(2,'0');clock.style.color=remaining<=120?'#ffb7a8':'var(--gold)'}
function progress(){return '<div class="bar" aria-label="Progress">'+Array.from({length:6},(_,i)=>'<span class="'+(i<stage?'done':'')+'"></span>').join('')+'</div>'}function shell(label,title,body){app.innerHTML='<section class="card"><div class="eyebrow">'+label+'</div><h2>'+title+'</h2>'+progress()+body+'</section>';window.scrollTo({top:0,behavior:'instant'})}function opts(items,name){return '<div class="stack">'+items.map(([k,t])=>'<label class="option"><input type="checkbox" name="'+name+'" value="'+k+'"><span><strong>'+k+'.</strong> '+esc(t)+'</span></label>').join('')+'</div>'}function picked(name){return [...document.querySelectorAll('input[name="'+name+'"]:checked')].map(x=>x.value).sort()}function same(a,b){return JSON.stringify(a.slice().sort())===JSON.stringify(b.slice().sort())}function msg(text,ok=false){let el=document.getElementById('msg');if(el){el.textContent=text;el.className='feedback'+(ok?' ok':'');el.classList.remove('hidden')}}function next(){stage++;render()}
function render(){if(stage===-1){app.innerHTML='<section class="card"><div class="hero"><div class="eyebrow">Private office · After hours</div><h1>THE LAST<br>SIGNATURE</h1><p class="lead">The owner of Verity Gallery has vanished. The biggest art sale in the gallery’s history is at risk. You are locked inside the private office. Find the signed contract before the buyer arrives.</p></div><p class="lead">Investigate four evidence files to recover a four-digit safe code. Inside the safe, solve the final clause to open a four-letter filing-cabinet lock. You have <b>15 minutes</b>.</p><label for="team">Team name</label><div class="actions"><input class="field" id="team" maxlength="32" placeholder="The Contract Detectives"><button class="btn" id="begin">ENTER THE GALLERY →</button></div><p class="small">Play on one device per team. No hints are available. Your timer starts when you enter.</p></section>';document.getElementById('begin').onclick=()=>{team=document.getElementById('team').value.trim()||'The Contract Detectives';stage=0;startTimer();render()};return}
if(stage===99){shell('Time expired','THE BUYER HAS ARRIVED','<p class="lead">The buyer arrived before your team recovered the signed contract. Try again and see if you can escape in time.</p><button class="btn" id="restart">RESTART CASE</button>');document.getElementById('restart').onclick=restart;return}
if(stage===0){shell('Evidence file 1 / 4 · Offer','JUST BROWSING OR BINDING?','<p class="puzzletext">The gallery owner left six notes. <b>Select every statement that is a genuine legal offer.</b> Advertisements and invitations to negotiate usually are not offers, but sufficiently definite promises can be.</p>'+opts(offer,'offer')+'<div class="actions"><button class="btn" id="submit">SUBMIT EVIDENCE</button></div><div id="msg" class="hidden"></div>');document.getElementById('submit').onclick=()=>{if(same(picked('offer'),correct[0])){digits[0]='3';stage=1;render()}else msg('Evidence rejected. Re-examine the six statements and try again.')};return}
if(stage===1){shell('Evidence file 2 / 4 · Acceptance','THE LETTER THAT BEAT THE EMAIL','<p class="puzzletext">Sort out the correspondence. Under the traditional mailbox rule, a properly mailed acceptance generally takes effect when dispatched, while a revocation takes effect when received. <b>On which day of the month was the contract formed?</b></p><div class="timeline"><div><b>Monday 4:</b> Verity Gallery’s written offer arrives at the buyer’s office.</div><div><b>Tuesday 5:</b> Verity posts a letter revoking the offer.</div><div><b>Wednesday 6:</b> The buyer posts a letter accepting the offer.</div><div><b>Thursday 7:</b> Verity’s revocation reaches the buyer.</div><div><b>Friday 8:</b> The buyer’s acceptance arrives at Verity.</div></div><div class="actions"><input id="day" class="field" type="number" min="1" max="31" placeholder="Day of the month" aria-label="Day of contract formation"><button class="btn" id="submit">CHECK TIMELINE</button></div><div id="msg" class="hidden"></div>');document.getElementById('submit').onclick=()=>{if(document.getElementById('day').value.trim()==='6'){digits[1]='6';stage=2;render()}else msg('That date does not match when acceptance became effective. Try again.')};return}
if(stage===2){shell('Evidence file 3 / 4 · Consideration',"WHAT’S IN IT FOR ME?",'<p class="puzzletext">Some promises involve a bargained-for legal benefit or detriment. Others involve past acts, existing duties, or gifts. <b>Select every numbered promise supported by valid consideration.</b></p>'+opts(consideration,'consideration')+'<div class="actions"><button class="btn" id="submit">VERIFY PROMISES</button></div><div id="msg" class="hidden"></div>');document.getElementById('submit').onclick=()=>{if(same(picked('consideration'),correct[2])){digits[2]='4';stage=3;render()}else msg('Not all selected promises have valid consideration. Try again.')};return}
if(stage===3){shell('Evidence file 4 / 4 · Legality','THE ILLEGAL ROOM','<p class="puzzletext">Verity Gallery hired Elite Renovations for five separately priced jobs. Two jobs are prohibited by law. <b>Select only the jobs that can legally be performed.</b></p>'+opts(jobs,'jobs')+'<div class="actions"><button class="btn" id="submit">INSPECT CONTRACT</button></div><div id="msg" class="hidden"></div>');document.getElementById('submit').onclick=()=>{if(same(picked('jobs'),correct[3])){digits[3]='3';stage=4;render()}else msg('The renovation contract still contains an unlawful job, or a lawful job is missing. Try again.')};return}
if(stage===4){shell('The safe · Four-digit lock','OPEN THE SAFE','<p class="lead">You recovered four digits from the evidence files. Enter them <b>in the order of the challenges</b> to unlock the safe and discover what is hidden inside.</p><div class="safe"><div class="wheel">✦</div></div><div class="actions"><input id="code" class="field" inputmode="numeric" maxlength="4" placeholder="••••" aria-label="Four digit safe combination"><button class="btn" id="unlock">UNLOCK SAFE</button></div><div id="msg" class="hidden"></div>');document.getElementById('unlock').onclick=()=>{let v=document.getElementById('code').value.trim();if(v===digits.join('')&&v==='3643'){stage=5;render()}else msg('ACCESS DENIED. Check the order of the four evidence files.')};return}
if(stage===5){shell('Security override · Safe unlocked','ACCESS GRANTED','<div class="opening"><div class="safe"><div class="wheel">✦</div></div><div class="status">CONFIDENTIAL EVIDENCE DISCOVERED</div></div><p class="lead" style="text-align:center">The safe has opened. Four case notes point to the final lock.</p><div class="actions" style="justify-content:center"><button class="btn" id="continue" disabled>OPEN THE EVIDENCE FILE</button></div>');setTimeout(()=>{let b=document.getElementById('continue');if(b){b.disabled=false;b.onclick=()=>{stage=6;render()}}},2100);return}
if(stage===6){shell('Final evidence · Four-letter word lock','THE FINAL CLAUSE','<p class="puzzletext">Four mini-stories are inside the safe. Identify the contract-law doctrine illustrated by each one. <b>Take the first letter of each doctrine in order</b> to form the four-letter filing-cabinet code.</p><div class="stack">'+stories.map((s,i)=>'<div class="tile"><b>CASE '+(i+1)+'</b><p>'+esc(s[1])+'</p></div>').join('')+'</div><div class="actions"><input class="field" id="word" maxlength="4" autocomplete="off" placeholder="Four-letter password" aria-label="Filing cabinet password"><button class="btn" id="unlock">OPEN FILING CABINET</button></div><div id="msg" class="hidden"></div>');document.getElementById('unlock').onclick=()=>{if(document.getElementById('word').value.trim().toUpperCase()==='DEAL'){finished=true;clearInterval(timer);stage=7;render()}else msg('The filing cabinet is still locked. Identify the four doctrines in order.')};return}
if(stage===7){let used=900-remaining,m=Math.floor(used/60),s=String(used%60).padStart(2,'0');shell('Mission complete · Verity Gallery','THE CONTRACT IS RECOVERED!','<div class="ending"><div class="seal">🏆</div><p class="lead">The filing cabinet swings open. Inside lies the signed art-sale contract. The buyer arrives just in time.</p><div class="score">'+m+':'+s+'</div><p>Escape time · '+esc(team)+'</p><div class="note">You solved all five challenges: Offer, Acceptance, Consideration, Legality, and the Final Clause.</div><button class="btn" id="restart">PLAY AGAIN</button></div>');document.getElementById('restart').onclick=restart;return}}
function restart(){clearInterval(timer);stage=-1;team='';remaining=900;finished=false;digits=[];updateClock();render()}updateClock();render();
</script></body></html>
