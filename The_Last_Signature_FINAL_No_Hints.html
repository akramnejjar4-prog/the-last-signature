<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Last Signature</title><style>:root{font-family:Georgia,serif;color:#f6e9ce;background:#0c1715}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 70% 0,#29473d,#0c1715 65%);min-height:100vh}.wrap{max-width:850px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;gap:12px}.tag{letter-spacing:3px;color:#d9b66e;font:12px Arial}.panel{background:#152822;border:1px solid #6b6246;border-radius:14px;padding:24px;margin:20px 0;box-shadow:0 12px 40px #0005}h1{font-size:clamp(32px,7vw,64px);margin:12px 0;color:#f7e8c6}h2{color:#f0d08c}p,li{line-height:1.65}.muted{color:#c1c7bd}button{cursor:pointer;background:#cda85d;border:0;border-radius:8px;padding:13px 19px;color:#15231b;font-weight:bold;margin:5px 5px 5px 0}button.secondary{background:#284a3c;color:#f8e8c6;border:1px solid #6b8a73}button:disabled{opacity:.4;cursor:not-allowed}.option{display:block;width:100%;text-align:left;background:#233a31;color:#f8eedb;border:1px solid #4e6758;margin:8px 0}.option.selected{background:#7a683b;border-color:#ebd092}.hidden{display:none}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}.digit{font:32px monospace;letter-spacing:12px;background:#07110e;color:#e4c47e;border:1px solid #947c4d;padding:12px;width:100%;max-width:240px;border-radius:8px}.small{font:13px Arial;color:#cbd3c9}.success{color:#b8e8b2}.error{color:#ffb5a9}.progress{height:7px;background:#3a5144;border-radius:9px;overflow:hidden}.progress div{height:100%;background:#d2af67;transition:width .3s}.evidence{border-left:3px solid #d2af67;padding:8px 16px;background:#21372d;margin:12px 0}.story{font-size:18px}.seal{text-align:center;font-size:70px;padding:15px}footer{text-align:center;color:#aeb8ab;font:12px Arial;padding:20px}input[type=text]{text-transform:uppercase}label{display:block}.timer{font:22px monospace;color:#e9c779}.notice{padding:10px;background:#263c31;border-radius:8px}#safeReveal{position:fixed;inset:0;z-index:9999;background:rgba(2,12,9,.96);display:grid;place-items:center;overflow:hidden;color:#e9d9a4;text-align:center}.safe-door{width:min(78vw,390px);min-height:300px;border:12px ridge #b19a63;border-radius:18px;background:linear-gradient(140deg,#263d35,#0b1815 65%,#32483d);box-shadow:0 0 65px #a8914a55;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:22px;transform-origin:left center;transition:transform 1.2s ease-in,opacity 1.2s ease-in}.safe-wheel{border:7px double #c9b77c;border-radius:50%;width:115px;height:115px;display:grid;place-items:center;font-size:65px;animation:wheelspin 1.2s ease-out}.safe-status{font-size:28px;font-weight:800;letter-spacing:3px;color:#e9d79b}.safe-subtitle{font-size:13px;letter-spacing:2px;padding:0 14px}.opening .safe-door{transform:perspective(800px) rotateY(-72deg);opacity:.3}@keyframes wheelspin{from{transform:rotate(0)}to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.safe-wheel{animation:none}.safe-door{transition:none}} </style></head><body><main class="wrap"><header><span class="tag">VERITY GALLERY · CONFIDENTIAL</span><span class="timer" id="timer">15:00</span></header><div class="progress"><div id="bar" style="width:0%"></div></div><section id="app" class="panel"></section><footer>THE LAST SIGNATURE · BUSINESS LAW ESCAPE ROOM</footer></main><script>
const stages=[{title:'Just Browsing or Binding?',topic:'OFFER',intro:'The gallery owner left six notes. Select every statement that is a genuine offer.',mode:'multi',items:['A. A price tag displayed in a shop window.','B. A newspaper ad: “Saturday at 9 a.m. sharp: 3 brand-new framed prints, worth $300 each, for $10 each. First come, first served.”','C. “Would you consider selling your painting?”','D. An announcement that an auction will be held next week.','E. “I’ll sell you my car for $3,000. Let me know by Friday.”','F. “$200 reward to anyone who returns my lost dog.”'],correct:[1,4,5],digit:'3'},{title:'The Letter That Beat the Email',topic:'ACCEPTANCE',intro:'Inspect the correspondence. On what day of the month was the contract formed?',mode:'number',evidence:['Monday 4: Verity’s written offer arrives at the buyer’s office.','Tuesday 5: Verity posts a letter revoking the offer.','Wednesday 6: The buyer posts a letter accepting the offer.','Thursday 7: Verity’s revocation arrives at the buyer’s office.','Friday 8: The buyer’s acceptance arrives at Verity.'],digit:'6'},{title:"What's in It for Me?",topic:'CONSIDERATION',intro:'Select every promise supported by valid consideration.',mode:'multi',items:['1. A peppercorn exchanged for a promise (courts do not weigh adequacy).','2. Payment promised for repainting completed before anyone requested it.','3. A police officer promises to testify when already legally required by subpoena.','4. A nephew promises to give up drinking and smoking in exchange for money.','5. Sailors demand extra pay to perform the same voyage already required by contract.','6. An aunt promises money “because you’re my favorite.”','7. Someone promises not to sue over a genuine disputed claim in exchange for payment.','8. A buyer promises money in exchange for a seller’s laptop.'],correct:[0,3,6,7],digit:'4'},{title:'The Illegal Room',topic:'LEGAL PURPOSE',intro:'The gallery hired Elite Renovations for five separately priced jobs. Select only the jobs that can legally be performed.',mode:'multi',items:['1. Convert a storage room into an exhibition room after obtaining the required permit.','2. Build an extra exhibition room despite local zoning prohibitions.','3. Install security cameras throughout the gallery.','4. Remove an emergency exit to make space for paintings.','5. Replace the lighting with LED fixtures.'],correct:[0,2,4],digit:'3'}];const finalStories=[['A buyer signs only because a seller threatens unlawful harm.','Duress'],['A gallery reasonably relies on a clear promise and suffers a loss when it is withdrawn.','Estoppel (promissory)'],['Before performance is due, a contractor clearly announces they will not perform.','Anticipatory repudiation'],['An offer states it expires Friday, and acceptance is attempted Saturday.','Lapse of offer']];let stage=-1,selected=new Set(),digits=[],time=900,timerId=null,errors=0,team='';const app=document.getElementById('app');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){document.getElementById('bar').style.width=(Math.max(0,stage)/5*100)+'%';if(stage===-1){app.innerHTML=`<div class="seal">🖼️</div><div class="tag">PRIVATE OFFICE · AFTER HOURS</div><h1>THE LAST SIGNATURE</h1><p class="story">The owner of Verity Gallery has vanished before the biggest art sale in its history. You are locked inside the private office. A four-digit safe and a four-letter filing cabinet stand between you and the missing signed contract.</p><p class="muted">You have 15 minutes. Solve four contract-law puzzles to discover the safe code, then unlock the final clause.</p><label>Team name <input id="team" maxlength="35" placeholder="The Contract Detectives" style="padding:12px;background:#0b1913;color:white;border:1px solid #8e8058;border-radius:8px;width:100%;margin:10px 0"></label><button onclick="start()">Enter the gallery →</button>`;return}if(stage===4){app.innerHTML=`<div class="tag">THE SAFE · FOUR-DIGIT LOCK</div><h2>Open the safe</h2><p>You recovered four digits, in order. Enter the combination to unlock the evidence inside.</p><input id="code" class="digit" maxlength="4" inputmode="numeric" placeholder="••••"><p><button onclick="checkSafe()">Unlock safe</button></p><div id="msg" aria-live="polite"></div>`;return}if(stage===5){app.innerHTML=`<div class="tag">THE FINAL CLAUSE · FOUR-LETTER LOCK</div><h2>The Filing Cabinet</h2><p>Inside the safe are four mini-stories. Identify each legal doctrine. Their first letters spell the final password.</p>${finalStories.map((x,i)=>`<div class="evidence"><strong>Case ${i+1}</strong><p>${esc(x[0])}</p><select id="doctrine${i}" style="width:100%;padding:10px;background:#0d2019;color:white;border:1px solid #7c875d"><option value="">Choose doctrine</option>${finalStories.map(y=>`<option value="${esc(y[1])}">${esc(y[1])}</option>`).join('')}</select></div>`).join('')}<label>Final four-letter password<input id="word" class="digit" maxlength="4" placeholder="????" style="font-size:25px"></label><p><button onclick="checkFinal()">Open filing cabinet</button> </p><div id="msg" aria-live="polite"></div>`;return}if(stage===6){clearInterval(timerId);app.innerHTML=`<div class="seal">🏆</div><div class="tag">CASE CLOSED</div><h1>CONTRACT RECOVERED!</h1><p class="story">Congratulations, <strong>${esc(team)}</strong>! You opened the safe, solved the final clause, and recovered the signed contract before the buyer arrived.</p><p class="success">Time remaining: ${format(time)} · Incorrect attempts: ${errors}</p><div class="notice">Show this screen to your instructor to confirm your team's finish time.</div><button onclick="location.reload()">Play again</button>`;return}const p=stages[stage];app.innerHTML=`<div class="tag">EVIDENCE FILE ${stage+1}/4 · ${p.topic}</div><h2>${p.title}</h2><p>${p.intro}</p>${p.mode==='multi'?p.items.map((x,i)=>`<button class="option" id="opt${i}" onclick="toggle(${i})">${esc(x)}</button>`).join(''):p.evidence.map(x=>`<div class="evidence">${esc(x)}</div>`).join('')+'<label>Day of the month<input id="num" class="digit" maxlength="2" inputmode="numeric" placeholder="?" style="margin-top:10px"></label>'}<p><button onclick="checkPuzzle()">Submit evidence</button></p><div id="msg" aria-live="polite"></div>`}function start(){team=document.getElementById('team').value.trim()||'Detectives';stage=0;render();timerId=setInterval(()=>{if(time>0)time--;document.getElementById('timer').textContent=format(time);if(time===0){clearInterval(timerId);app.innerHTML='<h1>TIME IS UP!</h1><p>The buyer has arrived. Your team did not recover the contract in time.</p><button onclick="location.reload()">Try again</button>'}},1000)}function format(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}function toggle(i){selected.has(i)?selected.delete(i):selected.add(i);document.getElementById('opt'+i).classList.toggle('selected',selected.has(i))}function message(t,ok=false){document.getElementById('msg').innerHTML=`<p class="${ok?'success':'error'}">${esc(t)}</p>`}function checkPuzzle(){const p=stages[stage];let ok=p.mode==='multi'?selected.size===p.correct.length&&p.correct.every(x=>selected.has(x)):document.getElementById('num').value.trim()===p.digit;if(!ok){errors++;message('The evidence does not fit. Reconsider your answer.');return}digits.push(p.digit);selected.clear();stage++;render()}function checkSafe(){if(document.getElementById('code').value.trim()===digits.join('')){const overlay=document.createElement('div');overlay.id='safeReveal';overlay.innerHTML='<div class="safe-door"><div class="safe-wheel">✦</div><div class="safe-status">ACCESS GRANTED</div><div class="safe-subtitle">CONFIDENTIAL EVIDENCE DISCOVERED</div></div>';document.body.appendChild(overlay);setTimeout(()=>{overlay.classList.add('opening')},120);setTimeout(()=>{overlay.remove();stage=5;render()},2600)}else{errors++;message('The safe refuses to open. Recheck the four digits in order.')}}function checkFinal(){let valid=finalStories.every((x,i)=>document.getElementById('doctrine'+i).value===x[1]);if(valid&&document.getElementById('word').value.trim().toUpperCase()==='DEAL'){stage=6;render()}else{errors++;message('The cabinet remains locked. Verify the four doctrines and their initials.')}}render();</script></body></html>
